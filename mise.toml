[tools]
go = "1.27.3"
# Pinned to the version the CI runs (.github/workflows/ci.yml), so
# `mise run lint` and CI give the same results.
golangci-lint = "2.15.0"

[tasks.build]
description = "Build the xo binary into dist/"
run = "go build -o dist/xo ./cmd/xo"

[tasks.docs]
description = "Regenerate the Markdown command reference (docs/reference/cli)"
run = "go run ./tools/gendocs -markdown docs/reference/cli"

[tasks.test]
description = "Run the unit test suite"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint, go vet and check formatting"
run = """
golangci-lint run &&
go vet ./... &&
test -z "$(gofmt -l .)" && echo "gofmt: OK"
"""
